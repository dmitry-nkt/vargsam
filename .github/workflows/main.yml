name: Deploy Card Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build card site
        env:
          ASTRO_BASE: /
          PUBLIC_LEADS_ENDPOINT: /api/lead
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  ensure-vps-docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Docker and Compose on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            if ! command -v docker >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1; then
                curl -fsSL https://get.docker.com | sudo sh
              else
                curl -fsSL https://get.docker.com | sh
              fi
            fi

            if ! docker compose version >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1; then
                sudo apt-get update -y
                sudo apt-get install -y docker-compose-plugin
              else
                apt-get update -y
                apt-get install -y docker-compose-plugin
              fi
            fi

            docker --version
            docker compose version

  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to GitHub Pages (root)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: .
          keep_files: true

  deploy-vps:
    needs: [build, ensure-vps-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Ensure static deploy directory exists on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p "${{ secrets.DEPLOY_PATH }}/dist" "${{ secrets.DEPLOY_PATH }}/nginx-host"

      - name: Rsync static site files to server
        uses: burnett01/rsync-deployments@v8
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: ${{ secrets.DEPLOY_PATH }}/dist
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Rsync static Docker config to server
        uses: burnett01/rsync-deployments@v8
        with:
          switches: -avzr
          path: deploy/static/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Rsync host nginx site config to server
        uses: burnett01/rsync-deployments@v8
        with:
          switches: -avzr
          path: deploy/host-nginx/
          remote_path: ${{ secrets.DEPLOY_PATH }}/nginx-host
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Restart static site container and reload host nginx
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose up -d
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO=sudo; fi
            $SUDO install -m 644 "${{ secrets.DEPLOY_PATH }}/nginx-host/yggdrasil-ko.ru" /etc/nginx/sites-available/yggdrasil-ko.ru
            $SUDO ln -sf /etc/nginx/sites-available/yggdrasil-ko.ru /etc/nginx/sites-enabled/yggdrasil-ko.ru
            if command -v nginx >/dev/null 2>&1; then
              $SUDO nginx -t
              $SUDO systemctl reload nginx
            fi

  deploy-vps-leads-api:
    needs: [build, ensure-vps-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure API directory exists on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mkdir -p "${{ secrets.DEPLOY_API_PATH }}"

      - name: Rsync API files to server
        uses: burnett01/rsync-deployments@v8
        with:
          switches: -avzr --delete
          path: api/
          remote_path: ${{ secrets.DEPLOY_API_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Install and restart API service
        uses: appleboy/ssh-action@v1.2.2
        env:
          PORT: ${{ secrets.LEADS_PORT }}
          ALLOW_ORIGIN: ${{ secrets.LEADS_ALLOW_ORIGIN }}
          SMTP_HOST: ${{ secrets.LEADS_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.LEADS_SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.LEADS_SMTP_SECURE }}
          SMTP_USER: ${{ secrets.LEADS_SMTP_USER }}
          SMTP_PASS: ${{ secrets.LEADS_SMTP_PASS }}
          MAIL_FROM: ${{ secrets.LEADS_MAIL_FROM }}
          MAIL_TO: ${{ secrets.LEADS_MAIL_TO }}
          LEADS_SUBJECT: ${{ secrets.LEADS_SUBJECT }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: PORT,ALLOW_ORIGIN,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASS,MAIL_FROM,MAIL_TO,LEADS_SUBJECT
          script: |
            set -e
            cd "${{ secrets.DEPLOY_API_PATH }}"
            printf '%s\n' \
              "PORT=${PORT}" \
              "ALLOW_ORIGIN=${ALLOW_ORIGIN}" \
              "SMTP_HOST=${SMTP_HOST}" \
              "SMTP_PORT=${SMTP_PORT}" \
              "SMTP_SECURE=${SMTP_SECURE}" \
              "SMTP_USER=${SMTP_USER}" \
              "SMTP_PASS=${SMTP_PASS}" \
              "MAIL_FROM=${MAIL_FROM}" \
              "MAIL_TO=${MAIL_TO}" \
              "LEADS_SUBJECT=${LEADS_SUBJECT}" > .env.runtime

            docker compose up -d --build
